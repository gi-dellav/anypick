[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anypick"
version = "0.1.0"
description = "Select an LLM across providers using capability, pricing and benchmark filters, then pick the best."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "anypick" }]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.scripts]
anypick = "anypick.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["anypick*"]
